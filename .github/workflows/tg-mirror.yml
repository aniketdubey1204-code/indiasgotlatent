name: tg-mirror
on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours; exits in ~30s when nothing new
  workflow_dispatch: {}      # manual "Run workflow" button for first backfill

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Start local Bot API server (lifts upload cap 50MB -> 2GB)
        run: |
          docker run -d --name tg-bot-api -p 8081:8081 aiogram/telegram-bot-api:latest \
            --api-id=${{ secrets.TG_API_ID }} --api-hash=${{ secrets.TG_API_HASH }} --local
          sleep 8; docker logs tg-bot-api 2>&1 | tail -3
      - run: python tg-mirror/mirror.py
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_CHANNEL_ID: ${{ secrets.TG_CHANNEL_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
