name: tg-mirror
on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours; exits in ~30s when nothing new
  workflow_dispatch: {}      # manual "Run workflow" button for first backfill

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests pyrogram tgcrypto
      - run: python tg-mirror/mirror.py
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_CHANNEL_ID: ${{ secrets.TG_CHANNEL_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
